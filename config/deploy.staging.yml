ssh:
  user: xenor
servers:
  web:
    hosts:
      - 192.168.2.73
proxy:
  host: uv-bingo.testing.xenor.ovh
env:
  clear:
    RAILS_ENV: staging
    APP_HOST: uv-bingo.testing.xenor.ovh
    APP_URL: https://uv-bingo.testing.xenor.ovh
  secret:
    - SECRET_KEY_BASE
    - POSTGRES_PASSWORD
    - ADMIN_DISCORD_IDS
    - STAGING_HTTP_USER
    - STAGING_HTTP_PASSWORD
accessories:
  db:
    image: postgres:17-alpine
    roles: [web]
    env:
      clear:
        POSTGRES_USER: uv_bingo
        POSTGRES_DB: uv_bingo_staging
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
