ssh:
  user: ubuntu
servers:
  web:
    hosts:
      - 5.135.141.150
proxy:
  host: bingo.xenor.ovh
env:
  clear:
    RAILS_ENV: production
    APP_HOST: bingo.xenor.ovh
    APP_URL: https://bingo.xenor.ovh
    DISCORD_STAGING_GUILD_ID: "725336022657007788"
    DISCORD_STAGING_INTERACTIONS_URL: https://bing.testing.xenor.ovh/discord/interactions
accessories:
  db:
    image: postgres:17-alpine
    roles: [web]
    env:
      clear:
        POSTGRES_USER: uv_bingo
        POSTGRES_DB: uv_bingo_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
